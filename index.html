<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> My hobby tracker</title>

    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <div id="root">
        <div class="topbar">
            <div class="topbar-title">My hobby Track<span>r</span></div>
            <button class="topbar-btn" id="topActionBtn" onclick="topAction()">+ New</button>
        </div>

        <div class="page active" id="pageHome">
            <div class="banner">
                <div>
                    <div id="overallPct">0%</div>
                    <div id="overallSub"></div>
                </div>
            </div>

            <div id="trackerList"></div>
        </div>

        <div class="page" id="pageResources">
            <div class="page" id="pageDetail">
                <button class="back-btn" onclick="goHome()">← Back</button>
                <div id="detailContent"></div>
            </div>
            <div id="resourcesList"></div>
        </div>

        <!-- ADD TRACKER MODAL -->
        <div class="modal-overlay hidden" id="addModal">
            <div class="modal-box">
                <div id="modalStep1">
                    <div class="modal-title">New Tracker</div>
                    <div class="modal-sub">Choose a starting template</div>
                    <div id="templateList"></div>
                </div>
                <div id="modalStep2" style="display:none">
                    <div class="modal-title">Customise</div>
                    <div class="modal-sub">Name, emoji and color</div>
                    <div id="previewBox"
                        style="background:var(--s2);border:1px solid var(--bd);border-radius:14px;padding:20px;text-align:center;margin-bottom:4px">
                        <div id="prevEmoji" style="font-size:36px;margin-bottom:8px">🎯</div>
                        <div id="prevName"
                            style="font-family:Syne,sans-serif;font-size:18px;font-weight:800;margin-bottom:4px">Tracker
                            Name</div>
                        <div id="prevDesc" style="font-size:12px;color:var(--t3)">Description</div>
                    </div>
                    <div class="field-lbl">NAME</div>
                    <input class="inp" id="inp-name" placeholder="e.g. Gym Tracker, Book List..."
                        oninput="updatePreview()" />
                    <div class="field-lbl">DESCRIPTION</div>
                    <input class="inp" id="inp-desc" placeholder="What are you tracking?" oninput="updatePreview()" />
                    <div class="field-lbl">EMOJI</div>
                    <div class="emoji-grid" id="emojiGrid"></div>
                    <div class="field-lbl">COLOR</div>
                    <div class="color-row" id="colorRow"></div>
                    <div class="btn-row">
                        <button class="btn btn-ghost" onclick="modalBack()">← Back</button>
                        <button class="btn btn-primary" onclick="goStep3()">Edit Sections →</button>
                    </div>
                </div>
                <div id="modalStep3" style="display:none">
                    <div class="modal-title">Sections & Tasks</div>
                    <div class="modal-sub">Tap any text to edit. Add or remove freely.</div>
                    <div id="sectionsEditor"></div>
                    <button class="add-sec-btn" id="addSecBtn" onclick="addSection()">+ Add Section</button>
                    <button class="btn btn-primary" style="width:100%;margin-top:4px" onclick="saveNewTracker()">💾 Save
                        Tracker</button>
                    <div style="height:20px"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/events.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
