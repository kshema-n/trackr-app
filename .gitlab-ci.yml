stages:
  - deploy

deploy-pages:
  stage: deploy
  script:
    - mkdir -p public
    - |
      cat > public/index.html << 'EOF'
      <!doctype html>
      <html>
      <head><meta charset="utf-8"><title>Pages</title></head>
      <body><h1>GitLab Pages is working</h1></body>
      </html>
      EOF
    - test -s public/index.html
  pages:
    publish: public
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
